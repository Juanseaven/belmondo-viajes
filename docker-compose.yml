# Panel espejo de WhatsApp — stack single-tenant.
# Una copia de este compose por agencia. Nada se comparte entre clientes.
#
# Exposición de red (deliberada):
#   - postgres / redis  -> sin puertos publicados. Solo alcanzables por DNS interno.
#   - evolution-api     -> publicado SOLO en 127.0.0.1. Se accede por túnel SSH para
#                          escanear el QR. Nunca abierto a internet: su API key da
#                          control total sobre las líneas de WhatsApp.
#   - backend / web     -> los únicos servicios con cara pública.

name: whatsapp-mirror

services:
  # ---------------------------------------------------------------------------
  # Postgres: aloja DOS bases separadas.
  #   evolution -> propiedad de Evolution API (la gestiona su propio Prisma).
  #   mirror    -> la nuestra. Nunca leemos las tablas de Evolution directamente;
  #                el contrato entre ambos sistemas es el webhook.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mirror
      # Necesario para que el healthcheck y psql no dependan del locale del host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta una sola vez, con el volumen vacío. Crea la base de Evolution.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backbone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d mirror"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis: cache de sesiones de Evolution + nuestro registro de mensajes salientes
  # del panel (clave para distinguir 'panel' de 'device' en la auditoría).
  # Bases separadas por índice: 0 para Evolution, 1 para el backend.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wm-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # Las claves de sesión de Evolution NO deben desalojarse por presión de
      # memoria: perderlas obliga a re-escanear el QR de todas las líneas.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    networks:
      - backbone
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Evolution Go 0.7.2. Las sesiones viven en Postgres y cada línea usa un
  # token propio. El backend configura su webhook al conectar la instancia.
  # ---------------------------------------------------------------------------
  evolution-go:
    image: evoapicloud/evolution-go:0.7.2
    container_name: wm-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: whatsapp-crm
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_OPERATOR_EMAIL: ${EVOLUTION_OPERATOR_EMAIL:-}

      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "true"

      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "30"

      WADEBUG: ${EVOLUTION_LOG_LEVEL:-INFO}
      LOGTYPE: console
      OS_NAME: WhatsApp CRM
      TZ: ${TZ:-America/Bogota}
    networks:
      - backbone
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://127.0.0.1:8080/server/ok >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend Go: ingesta de webhooks, workers particionados, websockets y R2.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-go:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Bogota}

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mirror?sslmode=disable
      DATABASE_MAX_CONNS: "20"

      REDIS_ADDR: redis:6379
      REDIS_DB: "1"

      # Salida hacia Evolution: DNS interno, nunca el puerto publicado.
      EVOLUTION_BASE_URL: http://evolution-go:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_URL: http://backend:8080/webhooks/evolution

      # Concurrencia. WORKER_SHARDS define el paralelismo entre conversaciones;
      # el orden DENTRO de cada conversación queda garantizado por el particionado.
      WORKER_SHARDS: ${WORKER_SHARDS:-8}
      WORKER_QUEUE_SIZE: ${WORKER_QUEUE_SIZE:-512}
      MEDIA_WORKERS: ${MEDIA_WORKERS:-4}

      # Almacenamiento de archivos. Con las cuatro variables de R2 se usa R2; sin
      # ellas, el disco del contenedor (volumen `blobs`). O las cuatro o ninguna:
      # el backend rechaza una configuración a medias.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_SIGNED_URL_TTL: ${R2_SIGNED_URL_TTL:-15m}

      BLOBS_DIR: /data/blobs
      # Raíz por la que se alcanza este backend. La usan las URLs firmadas del
      # almacenamiento local, y tiene que servir para DOS consumidores: el
      # navegador y Evolution, que descarga los adjuntos que enviamos.
      PUBLIC_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8090}

      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}

      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-12h}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}

      # Solo se usan si `users` está vacía. Ver .env.example.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

      # Requisitos de viaje. Ver .env.example.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REQUISITOS_CONTACTO: ${REQUISITOS_CONTACTO:-}
      REQUISITOS_PASSPORT_INDEX: ${REQUISITOS_PASSPORT_INDEX:-true}
      REQUISITOS_BUSQUEDA_OFICIAL: ${REQUISITOS_BUSQUEDA_OFICIAL:-false}
      REQUISITOS_MODELO_BUSQUEDA: ${REQUISITOS_MODELO_BUSQUEDA:-}
    volumes:
      - blobs:/data/blobs
    networks:
      - backbone
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend Next.js.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Next.js hornea las NEXT_PUBLIC_* en el bundle en build time, no en
        # runtime. Por eso van como build args y no solo como environment.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8090}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8090}
    container_name: wm-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Bogota}
      # Server-side (SSR / route handlers) habla con el backend por red interna.
      INTERNAL_API_URL: http://backend:8080
    networks:
      - backbone

networks:
  backbone:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  # Adjuntos cuando no hay R2. Es un volumen y no una carpeta efímera porque
  # borrarlo pierde los archivos: las filas de media_assets quedarían apuntando a
  # claves que ya no existen.
  blobs:
