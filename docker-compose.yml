# Panel espejo de WhatsApp — stack single-tenant.
# Una copia de este compose por agencia. Nada se comparte entre clientes.
#
# Exposición de red (deliberada):
#   - postgres / redis  -> sin puertos publicados. Solo alcanzables por DNS interno.
#   - evolution-api     -> publicado SOLO en 127.0.0.1. Se accede por túnel SSH para
#                          escanear el QR. Nunca abierto a internet: su API key da
#                          control total sobre las líneas de WhatsApp.
#   - backend / web     -> los únicos servicios con cara pública.

name: whatsapp-mirror

services:
  # ---------------------------------------------------------------------------
  # Postgres: aloja DOS bases separadas.
  #   evolution -> propiedad de Evolution API (la gestiona su propio Prisma).
  #   mirror    -> la nuestra. Nunca leemos las tablas de Evolution directamente;
  #                el contrato entre ambos sistemas es el webhook.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mirror
      # Necesario para que el healthcheck y psql no dependan del locale del host.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Se ejecuta una sola vez, con el volumen vacío. Crea la base de Evolution.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backbone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d mirror"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis: cache de sesiones de Evolution + nuestro registro de mensajes salientes
  # del panel (clave para distinguir 'panel' de 'device' en la auditoría).
  # Bases separadas por índice: 0 para Evolution, 1 para el backend.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: wm-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # Las claves de sesión de Evolution NO deben desalojarse por presión de
      # memoria: perderlas obliga a re-escanear el QR de todas las líneas.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    networks:
      - backbone
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Evolution API v2. Mantiene N sesiones de WhatsApp simultáneas (una por
  # vendedor) y nos empuja todos los eventos por webhook global.
  # ---------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.3
    container_name: wm-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 127.0.0.1 es intencional. Ver nota de exposición arriba.
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      # URL con la que Evolution se referencia a sí mismo al construir enlaces.
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}

      # Autenticación global. Este valor es equivalente a la contraseña de todas
      # las líneas de WhatsApp de la agencia.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_mirror
      # Guardamos todo en Evolution: es nuestra red de seguridad si el backend
      # estuvo caído durante una ventana de webhooks.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: "604800"
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"

      # --- Webhook global: el corazón del espejo -------------------------------
      # DNS interno de Docker. El tráfico nunca sale de la red 'backbone'.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://backend:8080/webhooks/evolution
      # false = todos los eventos a una sola URL. Nuestro handler despacha por el
      # campo 'event' del payload. Un único endpoint es más fácil de asegurar.
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"

      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "true"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "true"
      WEBHOOK_EVENTS_CHATS_UPSERT: "true"
      WEBHOOK_EVENTS_CHATS_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      # Ruido puro para un panel de auditoría: un evento por cada "escribiendo...".
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_DELETE: "false"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "false"
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: "false"
      WEBHOOK_EVENTS_TYPEBOT_START: "false"
      WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_CALL: "true"

      # Reintentos: definen el contrato de nuestro handler. Si respondemos 503 por
      # contrapresión, Evolution reintenta y no se pierde el mensaje.
      WEBHOOK_REQUEST_TIMEOUT_MS: "30000"
      WEBHOOK_RETRY_MAX_ATTEMPTS: "10"
      WEBHOOK_RETRY_INITIAL_DELAY_SECONDS: "5"
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_RETRY_MAX_DELAY_SECONDS: "300"

      # El media lo bajamos y subimos nosotros a R2 desde internal/media.
      # Ver el spec para por qué no delegamos esto en Evolution.
      S3_ENABLED: "false"

      # Integraciones que no usamos. Apagadas para reducir superficie de ataque.
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      DIFY_ENABLED: "false"

      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR,WARN,INFO}
      LOG_COLOR: "false"
      LOG_BAILEYS: "error"
      LANGUAGE: es
      TZ: ${TZ:-America/Bogota}
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - backbone
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Backend Go: ingesta de webhooks, workers particionados, websockets y R2.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: wm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-America/Bogota}

      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mirror?sslmode=disable
      DATABASE_MAX_CONNS: "20"

      REDIS_ADDR: redis:6379
      REDIS_DB: "1"

      # Salida hacia Evolution: DNS interno, nunca el puerto publicado.
      EVOLUTION_BASE_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      # El handler rechaza cualquier webhook cuya apikey no coincida.
      WEBHOOK_API_KEY: ${EVOLUTION_API_KEY}

      # Concurrencia. WORKER_SHARDS define el paralelismo entre conversaciones;
      # el orden DENTRO de cada conversación queda garantizado por el particionado.
      WORKER_SHARDS: ${WORKER_SHARDS:-8}
      WORKER_QUEUE_SIZE: ${WORKER_QUEUE_SIZE:-512}
      MEDIA_WORKERS: ${MEDIA_WORKERS:-4}

      # Almacenamiento de archivos. Con las cuatro variables de R2 se usa R2; sin
      # ellas, el disco del contenedor (volumen `blobs`). O las cuatro o ninguna:
      # el backend rechaza una configuración a medias.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_SIGNED_URL_TTL: ${R2_SIGNED_URL_TTL:-15m}

      BLOBS_DIR: /data/blobs
      # Raíz por la que se alcanza este backend. La usan las URLs firmadas del
      # almacenamiento local, y tiene que servir para DOS consumidores: el
      # navegador y Evolution, que descarga los adjuntos que enviamos.
      PUBLIC_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8090}

      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}

      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-12h}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}

      # Solo se usan si `users` está vacía. Ver .env.example.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - blobs:/data/blobs
    networks:
      - backbone
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Frontend Next.js.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Next.js hornea las NEXT_PUBLIC_* en el bundle en build time, no en
        # runtime. Por eso van como build args y no solo como environment.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8090}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8090}
    container_name: wm-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-America/Bogota}
      # Server-side (SSR / route handlers) habla con el backend por red interna.
      INTERNAL_API_URL: http://backend:8080
    networks:
      - backbone

networks:
  backbone:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  # Adjuntos cuando no hay R2. Es un volumen y no una carpeta efímera porque
  # borrarlo pierde los archivos: las filas de media_assets quedarían apuntando a
  # claves que ya no existen.
  blobs:
