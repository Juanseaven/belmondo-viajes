services:
  backend:
    environment:
      PUBLIC_BASE_URL: ${DEMO_PUBLIC_URL:-http://127.0.0.1:8088}
      CORS_ALLOWED_ORIGINS: ${DEMO_PUBLIC_URL:-http://127.0.0.1:8088}

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: same-origin
        NEXT_PUBLIC_WS_URL: same-origin

  demo-gateway:
    image: nginx:1.27-alpine
    container_name: wm-demo-gateway
    restart: "no"
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "127.0.0.1:${DEMO_GATEWAY_PORT:-8088}:8080"
    volumes:
      - ./infra/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backbone
